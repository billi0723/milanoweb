<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form method="post" enctype="multipart/form-data" action="">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="OK" />
    </form>
    {%if testo%}
    <form method="post" enctype="multipart/form-data" action="{%url 'save_DataPDF' %}">
        {% csrf_token %}
        <input type="submit" value="Save" />
    </form>

    <h4 style="color:green">{{num}}</h4>
    <pre style="color:darkslategrey; padding:40px; text-size-adjust:initial; white-space:pre-wrap; word-wrap:break-word">{{testo|safe}}</pre>
    {%endif%}
</body>
</html>
